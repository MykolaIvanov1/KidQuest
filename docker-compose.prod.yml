name: kidquest-production

x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kidquest}
      POSTGRES_DB: ${POSTGRES_DB:-kidquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *logging

  migrate:
    image: kidquest-migrate:${KIDQUEST_IMAGE_TAG:-local}
    pull_policy: build
    build:
      context: .
      target: migrate
    restart: 'no'
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db in .env.production}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  api:
    image: kidquest-api:${KIDQUEST_IMAGE_TAG:-local}
    pull_policy: build
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '4000'
      TRUST_PROXY: '1'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-30d}
      FRONTEND_URL: https://${KIDQUEST_DOMAIN:?Set KIDQUEST_DOMAIN in .env.production}
      STORAGE_PATH: /app/storage
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    volumes:
      - photos:/app/storage
    networks:
      - database
      - edge
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *logging

  web:
    image: kidquest-web:${KIDQUEST_IMAGE_TAG:-local}
    pull_policy: build
    build:
      context: .
      target: web
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    restart: unless-stopped
    init: true
    environment:
      KIDQUEST_DOMAIN: ${KIDQUEST_DOMAIN:?Set KIDQUEST_DOMAIN in .env.production}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.production}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  database:
    internal: true
  edge:

volumes:
  postgres_data:
  photos:
  caddy_data:
  caddy_config:
