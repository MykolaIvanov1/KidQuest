name: KidQuest checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kidquest_test
          POSTGRES_PASSWORD: ephemeral_ci_database_only
          POSTGRES_DB: kidquest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kidquest_test -d kidquest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kidquest_test:ephemeral_ci_database_only@localhost:5432/kidquest_test?schema=public
      DATABASE_TEST_URL: postgresql://kidquest_test:ephemeral_ci_database_only@localhost:5432/kidquest_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm db:test
      - run: pnpm build
